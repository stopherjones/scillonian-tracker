name: Daily Vessel Tracker

on:
  schedule:
    - cron: '0 8 * * *'       # 08:00 UTC: log position AND send the daily email
    - cron: '0 2,14,20 * * *' # 02:00, 14:00, 20:00 UTC: log position only
  workflow_dispatch:           # Manual run from the Actions tab (also sends the email)

permissions:
  contents: write              # needed to commit positions.json

concurrency:
  group: vessel-tracker
  cancel-in-progress: false

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install websockets

      - name: Execute script
        env:
          AISSTREAM_KEY: ${{ secrets.AISSTREAM_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          LISTEN_SECONDS: '240'
          SEND_EMAIL: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '0 8 * * *' }}
        run: python tracker.py

      - name: Commit position log
        run: |
          git config user.name "vessel-tracker"
          git config user.email "actions@users.noreply.github.com"
          git add positions.json
          git diff --staged --quiet || (git commit -m "Update ship positions" && git push)